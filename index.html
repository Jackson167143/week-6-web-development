<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>SpendWise</h1>
        <p>Track your income and expenses in one place.</p>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Income</h3>
                <p id="totalIncome">KSh 0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">KSh 0</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balance">KSh 0</p>
            </div>
        </section>

        <!-- Income Form -->
        <section>
            <h2>Add Income</h2>

            <form id="incomeForm">
                <input
                    type="number"
                    id="incomeAmount"
                    placeholder="Income amount"
                    required
                >

                <button type="submit">Add Income</button>
            </form>
        </section>

        <!-- Expense Form -->
        <section>
            <h2>Add Expense</h2>

            <form id="expenseForm">
                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    required
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount"
                    required
                >

                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <!-- Budget Feedback -->
        <div id="budgetMessage"></div>

        <!-- Expenses -->
        <section>
            <h2>Your Expenses</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                    </tr>
                </thead>

                <tbody id="expenseList">
                </tbody>
            </table>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
